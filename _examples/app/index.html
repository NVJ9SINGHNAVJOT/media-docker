<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>media-docker demo</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  :root {
    --bg: #0f172a;
    --bg-glass: rgba(30, 41, 59, 0.7);
    --border-glass: rgba(255, 255, 255, 0.1);
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
  }
  
  body { 
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
    color: var(--text-primary);
    max-width: 46rem; 
    margin: 3rem auto; 
    padding: 0 1.5rem; 
    line-height: 1.6;
    min-height: 100vh;
  }
  
  h1 { 
    font-size: 2.2rem; 
    font-weight: 700;
    margin-bottom: 0.5rem; 
    background: linear-gradient(to right, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  p.lede { 
    margin-top: 0; 
    color: var(--text-muted); 
    font-size: 1.1rem;
    margin-bottom: 2.5rem;
  }
  
  fieldset { 
    background: var(--bg-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-glass);
    border-radius: 16px; 
    padding: 2rem; 
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
  }
  
  label { 
    display: block; 
    margin: 1.2rem 0 0.5rem; 
    font-weight: 600; 
    font-size: 0.95rem;
    color: #e2e8f0;
  }
  label:first-child { margin-top: 0; }
  
  select, input[type=file], input[type=number] { 
    width: 100%; 
    padding: 0.8rem 1rem; 
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border-glass);
    border-radius: 8px;
    color: white;
    font-family: inherit;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    box-sizing: border-box;
  }
  
  select:focus, input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
  }
  
  input[type=file]::file-selector-button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 1rem;
    font-weight: 500;
    transition: background 0.2s;
  }
  input[type=file]::file-selector-button:hover {
    background: var(--accent-hover);
  }
  
  button { 
    margin-top: 1.5rem; 
    padding: 0.8rem 1.5rem; 
    font: inherit; 
    font-weight: 600;
    cursor: pointer; 
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    width: 100%;
    transition: all 0.2s;
    box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4);
  }
  
  button:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 8px -1px rgba(59, 130, 246, 0.5);
  }
  
  button:disabled {
    background: #475569;
    cursor: not-allowed;
    box-shadow: none;
    opacity: 0.7;
    transform: none;
  }
  
  .asset { 
    background: var(--bg-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-glass);
    border-radius: 16px; 
    padding: 1.5rem; 
    margin-top: 2rem; 
    animation: slideUp 0.4s ease-out;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
  }
  
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .state { 
    display: inline-block; 
    padding: 0.3rem 0.8rem; 
    border-radius: 99px; 
    font-size: 0.75rem; 
    font-weight: 700; 
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .state.raw { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
  .state.converted { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
  .state.missing { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
  .state.unknown { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }
  
  code { 
    font-size: 0.9em; 
    word-break: break-all; 
    background: rgba(0, 0, 0, 0.4);
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #93c5fd;
    display: inline-block;
    margin-top: 1rem;
  }
  
  video, img, audio { 
    max-width: 100%; 
    margin-top: 1.2rem; 
    border-radius: 8px; 
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    background: #000;
  }
  
  .err { color: #fca5a5; white-space: pre-wrap; margin-top: 1rem; font-size: 0.9rem; text-align: center; }
  .muted { opacity: 0.7; font-size: 0.85rem; color: var(--text-muted); display: block; margin-top: 0.3rem; }
  
  [data-delete] {
    background: transparent;
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    margin-top: 1.5rem;
    box-shadow: none;
    width: auto;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
  }
  
  [data-delete]:hover:not(:disabled) {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.6);
  }

  /* --- Quality picker for video-resolutions --- */
  .quality-picker {
    display: none;
    margin-top: 1.2rem;
    animation: slideUp 0.3s ease-out;
  }
  .quality-picker.visible {
    display: block;
  }
  .quality-picker-label {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #94a3b8;
    margin-bottom: 0.5rem;
  }
  .quality-buttons {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .quality-btn {
    margin: 0;
    padding: 0.4rem 0.9rem;
    font-size: 0.82rem;
    font-weight: 600;
    border-radius: 6px;
    width: auto;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border-glass);
    color: #cbd5e1;
    box-shadow: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .quality-btn:hover:not(:disabled) {
    background: rgba(59, 130, 246, 0.15);
    border-color: rgba(59, 130, 246, 0.4);
    color: #93c5fd;
    transform: none;
    box-shadow: none;
  }
  .quality-btn.active {
    background: rgba(59, 130, 246, 0.25);
    border-color: var(--accent);
    color: #60a5fa;
    box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.3);
  }
  .quality-info {
    margin-top: 0.6rem;
    font-size: 0.8rem;
    color: #64748b;
    min-height: 1.2em;
  }
  .quality-info span {
    color: #94a3b8;
    font-weight: 500;
  }
  .resolution-urls {
    margin-top: 0.8rem;
    display: none;
  }
  .resolution-urls.visible {
    display: block;
  }
  .resolution-urls summary {
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    color: #64748b;
    user-select: none;
    padding: 0.3rem 0;
  }
  .resolution-urls summary:hover {
    color: #94a3b8;
  }
  .url-list {
    margin-top: 0.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .url-entry {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.78rem;
  }
  .url-entry .res-label {
    font-weight: 700;
    color: #60a5fa;
    min-width: 3.5rem;
  }
  .url-entry code {
    margin: 0;
    padding: 0.15rem 0.4rem;
    font-size: 0.75rem;
  }
</style>
</head>
<body>
<h1>media-docker demo</h1>
<p class="lede">Upload something, then watch the same URL upgrade from your raw file to the
converted output &mdash; and switch back to the original at any point, because converting
never removes it.</p>

<fieldset>
  <label for="type">Upload as</label>
  <select id="type">
    <option value="video">video &mdash; single-quality HLS</option>
    <option value="video-resolutions">video-resolutions &mdash; full ladder + master playlist</option>
    <option value="image">image &mdash; compressed JPEG</option>
    <option value="audio">audio &mdash; MP3</option>
    <option value="document">document &mdash; stored as-is</option>
    <option value="other">other &mdash; anything, stored as-is</option>
  </select>

  <div id="optionWrap" hidden>
    <label for="option" id="optionLabel">Quality</label>
    <input type="number" id="option" min="40" max="100" placeholder="optional">
    <span class="muted" id="optionHint"></span>
  </div>

  <label for="file">File</label>
  <input type="file" id="file">

  <button id="go">Upload Media</button>
  <div id="error" class="err"></div>
</fieldset>

<div id="assets"></div>

<script>
const RESOLUTIONS = ["360", "480", "720", "1080"];

const OPTIONS = {
  video: { label: "Quality", min: 40, max: 100, hint: "40-100, optional" },
  image: { label: "Compression", min: 1, max: 31, hint: "1 (best) to 31 (worst), optional" },
  audio: { label: "Bitrate", choices: ["128k", "192k", "256k", "320k"], hint: "optional" },
};

const typeEl = document.getElementById("type");
const wrap = document.getElementById("optionWrap");
const optionLabel = document.getElementById("optionLabel");
const optionHint = document.getElementById("optionHint");
let optionEl = document.getElementById("option");

function renderOption() {
  const cfg = OPTIONS[typeEl.value];
  if (!cfg) { wrap.hidden = true; return; }
  wrap.hidden = false;
  optionLabel.textContent = cfg.label;
  optionHint.textContent = cfg.hint;

  const replacement = cfg.choices
    ? Object.assign(document.createElement("select"), { id: "option" })
    : Object.assign(document.createElement("input"), { id: "option", type: "number", placeholder: "optional" });

  if (cfg.choices) {
    replacement.append(new Option("default", ""));
    for (const c of cfg.choices) replacement.append(new Option(c, c));
  } else {
    replacement.min = cfg.min;
    replacement.max = cfg.max;
  }
  optionEl.replaceWith(replacement);
  optionEl = replacement;
}
typeEl.addEventListener("change", renderOption);
renderOption();

document.getElementById("go").addEventListener("click", async () => {
  const errEl = document.getElementById("error");
  errEl.textContent = "";

  const file = document.getElementById("file").files[0];
  if (!file) { errEl.textContent = "Pick a file first."; return; }

  const formData = new FormData();
  formData.append("type", typeEl.value);
  formData.append("name", file.name);
  if (!wrap.hidden && optionEl.value) formData.append("option", optionEl.value);
  formData.append("file", file);

  const btn = document.getElementById("go");
  btn.disabled = true;
  btn.textContent = "Uploading\u2026";
  try {
    const res = await fetch("/upload", { method: "POST", body: formData });
    const body = await res.json();
    if (!res.ok) throw new Error(body.message || "unknown");
    addAsset(body, typeEl.value);
  } catch (e) {
    errEl.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Upload Media";
  }
});

function embed(kind, url) {
  if (kind === "image") return `<img alt="">`;
  if (kind === "audio") return `<audio controls></audio>`;
  if (kind === "video" || kind === "video-resolutions") {
    return `<video controls></video>
      <p class="muted">Before conversion this is your original file and plays anywhere. After
      conversion the URL serves an HLS playlist, which plays natively in Safari but needs
      hls.js elsewhere &mdash; the URL is the same either way. Your upload is not consumed by
      the conversion, so the Original button keeps working afterwards.</p>`;
  }
  return `<p><a href="${url}">Download File</a> &mdash; documents and other files are never
    converted and are always served as attachments, so the asset URL and the original URL
    are the same file.</p>`;
}

/**
 * Builds a row of buttons that pick which representation to play.
 *
 * The same control serves two jobs: the resolution ladder for video-resolutions,
 * and a plain converted/original switch for everything else that plays inline.
 * Both end in the same place -- "original" is just another representation, one
 * that happens to always exist.
 */
function buildPicker(label, buttons, urls) {
  const buttonsHtml = buttons.map((b, i) =>
    `<button type="button" class="quality-btn${i === 0 ? " active" : ""}" data-quality="${b.value}">${b.text}</button>`
  ).join("");

  const urlsHtml = urls.length === 0 ? "" : `
    <div class="resolution-urls" data-resolution-urls>
      <details>
        <summary>Per-resolution URLs</summary>
        <div class="url-list">${urls.map(u =>
          `<div class="url-entry"><span class="res-label">${u.label}</span><code>${u.url}</code></div>`
        ).join("")}</div>
      </details>
    </div>`;

  return `
    <div class="quality-picker" data-quality-picker>
      <div class="quality-picker-label">${label}</div>
      <div class="quality-buttons">${buttonsHtml}</div>
      <div class="quality-info" data-quality-info></div>
    </div>${urlsHtml}`;
}

function addAsset(body, kind) {
  const isVideoRes = kind === "video-resolutions";
  const isVideo = kind === "video" || isVideoRes;
  const isPlayable = isVideo || kind === "image" || kind === "audio";
  const neverConverts = kind === "document" || kind === "other";

  const el = document.createElement("div");
  el.className = "asset";

  // video-resolutions gets the ladder plus Original; anything else that plays
  // inline gets a plain two-way switch. Nothing converts a document, so it has
  // nothing to switch between.
  let pickerHtml = "";
  if (isVideoRes && body.fileUrls) {
    pickerHtml = buildPicker(
      "Video quality",
      [{ value: "auto", text: "Auto" }]
        .concat(RESOLUTIONS.map(r => ({ value: r, text: r + "p" })))
        .concat([{ value: "original", text: "Original" }]),
      RESOLUTIONS.filter(r => body.fileUrls[r]).map(r => ({ label: r + "p", url: body.fileUrls[r] }))
    );
  } else if (isPlayable) {
    pickerHtml = buildPicker(
      "Source",
      [{ value: "converted", text: "Converted" }, { value: "original", text: "Original" }],
      []
    );
  }

  el.innerHTML = `
    <div><span class="state raw" data-state>checking\u2026</span></div>
    <p><code>${body.fileUrl}</code></p>
    <p class="muted">original &mdash; always the file you uploaded: <code>${body.originalUrl}</code></p>
    ${embed(kind, body.fileUrl)}
    ${pickerHtml}
    <p class="muted" data-detail></p>
    <button data-delete>Delete Asset</button>`;
  document.getElementById("assets").prepend(el);

  const stateEl = el.querySelector("[data-state]");
  const detailEl = el.querySelector("[data-detail]");
  const videoEl = el.querySelector("video");
  const mediaEl = videoEl || el.querySelector("img") || el.querySelector("audio");
  const picker = el.querySelector("[data-quality-picker]");
  const infoEl = el.querySelector("[data-quality-info]");
  const urlsEl = el.querySelector("[data-resolution-urls]");

  let tries = 0;
  let hls = null;
  let converted = false;
  let selected = isVideoRes ? "auto" : "converted";

  function setInfo(text) {
    if (infoEl) infoEl.textContent = text;
  }

  function destroyHls() {
    if (hls) {
      hls.destroy();
      hls = null;
    }
  }

  // Point a media element at a URL, forcing a refetch even when the URL string
  // has not changed -- the asset URL serves different bytes before and after
  // conversion, and the element would otherwise keep what it already loaded.
  function loadFile(url) {
    destroyHls();
    mediaEl.removeAttribute("src");
    mediaEl.src = url;
    if (typeof mediaEl.load === "function") mediaEl.load();
    if (typeof mediaEl.play === "function") mediaEl.play().catch(() => {});
  }

  // Load an HLS playlist. fixed pins the player to the single rung the playlist
  // contains, instead of letting it adapt.
  function loadHls(url, fixed) {
    destroyHls();

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ startLevel: fixed ? 0 : -1 });
      hls.loadSource(url);
      hls.attachMedia(videoEl);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        if (fixed) hls.currentLevel = 0;
        videoEl.play().catch(() => {});
      });

      hls.on(Hls.Events.LEVEL_SWITCHED, (_event, data) => {
        if (selected !== "auto" || !hls) return;
        const level = hls.levels[data.level];
        if (level) {
          setInfo(`Adaptive \u2014 currently playing ${level.height}p (${Math.round(level.bitrate / 1000)} kbps)`);
        }
      });
      return;
    }

    if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
      // Safari plays HLS natively.
      loadFile(url);
    }
  }

  // Play whichever representation is currently selected.
  function apply(value) {
    selected = value;
    if (!mediaEl) return;

    if (value === "original") {
      // The raw upload is a plain file, never a playlist, whatever the type.
      loadFile(body.originalUrl);
      setInfo("Source \u2014 the file exactly as you uploaded it");
      return;
    }

    if (!converted) {
      // The asset URL still resolves to the upload, so it plays as a plain file.
      loadFile(body.fileUrl);
      setInfo("The asset URL, still serving your upload \u2014 conversion has not finished");
      return;
    }

    if (!isVideo) {
      loadFile(body.fileUrl);
      setInfo("Converted output");
      return;
    }

    if (value === "auto" || value === "converted") {
      loadHls(body.fileUrl);
      setInfo(isVideoRes
        ? "Adaptive \u2014 player selects best quality automatically"
        : "Converted HLS stream");
      return;
    }

    const variantUrl = body.fileUrls && body.fileUrls[value];
    if (variantUrl) {
      loadHls(variantUrl, true);
      setInfo(`Fixed ${value}p`);
    }
  }

  if (picker) {
    const buttons = picker.querySelectorAll(".quality-btn");
    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        apply(btn.dataset.quality);
      });
    });
  }

  const tick = async () => {
    const r = await fetch("/status?url=" + encodeURIComponent(body.fileUrl)).then((x) => x.json());
    stateEl.className = "state " + r.state;
    stateEl.textContent =
      r.state === "raw" ? "serving original upload"
      : r.state === "converted" ? (neverConverts ? "stored" : "converted")
      : r.state === "missing" ? "gone"
      : "unknown";
    detailEl.textContent = r.target ? "\u2192 " + r.target : "";
    if (r.state === "raw" && tries++ < 600) setTimeout(tick, 2000);

    // While the asset URL is still the upload, play it from that URL: showing it
    // work before conversion is the whole point of the demo.
    if (r.state === "raw" && isPlayable && !converted && !mediaEl.src) {
      apply(selected);
    }

    // The upgrade happened. Reload the same URL to pick up the converted output,
    // and offer the original alongside it.
    if (r.state === "converted" && !converted && isPlayable) {
      converted = true;
      apply(selected);
      if (picker) picker.classList.add("visible");
      if (urlsEl) urlsEl.classList.add("visible");
    }
  };
  tick();

  el.querySelector("[data-delete]").addEventListener("click", async (e) => {
    e.target.disabled = true;
    destroyHls();
    const params = new URLSearchParams({ id: body.id, type: body.type });
    await fetch("/file?" + params, { method: "DELETE" });
    setTimeout(tick, 500);
  });
}
</script>
</body>
</html>
