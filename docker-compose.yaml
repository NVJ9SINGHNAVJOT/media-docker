version: '3.8'

# Reusable definitions for the consumer services. Every consumer runs the same
# shared runtime and differs only in its topic, env file and worker count.
x-consumer: &consumer
  build:
    context: .
    dockerfile: ./internal/Dockerfile.ffmpeg
  volumes:
    # Consumers write conversion output into asset directories that already
    # exist. They no longer mount the upload staging volume: since v4 uploads
    # are merged straight into media storage, so only the server stages chunks.
    - media-docker-files-data:/app/media_docker_files:rw
  networks:
    - media-docker-proxy
  restart: unless-stopped
  depends_on:
    - media-docker-kafka-0
  stop_grace_period: 60s

services:
  media-docker-client:
    build:
      context: .
      dockerfile: ./internal/Dockerfile
      args:
        SERVICE: media-docker-client
    container_name: media-docker-client
    volumes:
      # Keep the volume mapping unchanged to prevent breaking changes.
      - media-docker-files-data:/app/media_docker_files:ro
    networks:
      - proxy
    ports: [7000:7000] # Disable this in production
    env_file: .env.client
    stop_grace_period: 30s

  media-docker-server:
    build:
      context: .
      dockerfile: ./internal/Dockerfile
      args:
        SERVICE: media-docker-server
    container_name: media-docker-server
    volumes:
      # Keep the volume mapping unchanged to prevent breaking changes.
      - media-docker-upload-data:/app/uploadStorage:rw
      # NOTE: read-write since v4. The server writes each upload straight into
      # media storage so that its URL works before conversion has run.
      - media-docker-files-data:/app/media_docker_files:rw
    networks:
      - media-docker-proxy
    env_file: .env.server
    depends_on:
      - media-docker-video-consumer
      - media-docker-video-resolutions-consumer
      - media-docker-audio-consumer
      - media-docker-image-consumer
      - media-docker-delete-consumer
      - media-docker-failed-consumer
    stop_grace_period: 60s

  media-docker-video-consumer:
    <<: *consumer
    build:
      context: .
      dockerfile: ./internal/Dockerfile.ffmpeg
      args:
        SERVICE: media-docker-video-consumer
    container_name: media-docker-video-consumer
    env_file: .env.video

  media-docker-video-resolutions-consumer:
    <<: *consumer
    build:
      context: .
      dockerfile: ./internal/Dockerfile.ffmpeg
      args:
        SERVICE: media-docker-video-resolutions-consumer
    container_name: media-docker-video-resolutions-consumer
    env_file: .env.video-resolutions

  media-docker-audio-consumer:
    <<: *consumer
    build:
      context: .
      dockerfile: ./internal/Dockerfile.ffmpeg
      args:
        SERVICE: media-docker-audio-consumer
    container_name: media-docker-audio-consumer
    env_file: .env.audio

  media-docker-image-consumer:
    <<: *consumer
    build:
      context: .
      dockerfile: ./internal/Dockerfile.ffmpeg
      args:
        SERVICE: media-docker-image-consumer
    container_name: media-docker-image-consumer
    env_file: .env.image

  # Deletion needs no ffmpeg, so it builds from the slim image.
  media-docker-delete-consumer:
    <<: *consumer
    build:
      context: .
      dockerfile: ./internal/Dockerfile
      args:
        SERVICE: media-docker-delete-consumer
    container_name: media-docker-delete-consumer
    env_file: .env.delete

  media-docker-failed-consumer:
    <<: *consumer
    build:
      context: .
      dockerfile: ./internal/Dockerfile.ffmpeg
      args:
        SERVICE: media-docker-failed-consumer
    container_name: media-docker-failed-consumer
    env_file: .env.failed

  media-docker-kafka-0:
    image: apache/kafka:3.8.0
    container_name: media-docker-kafka-0
    volumes:
      - media-docker-kafka-0_data:/opt/kafka/data
    networks:
      - media-docker-proxy
    restart: unless-stopped
    environment:
      # KRaft settings for node 0
      - CLUSTER_ID=gZpsEhujeRQwA249Kx5KKg
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=0
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@media-docker-kafka-0:9093,1@media-docker-kafka-1:9093,2@media-docker-kafka-2:9093
      # Listeners
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://media-docker-kafka-0:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Clustering settings
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
    depends_on:
      - media-docker-kafka-1

  media-docker-kafka-1:
    image: apache/kafka:3.8.0
    container_name: media-docker-kafka-1
    volumes:
      - media-docker-kafka-1_data:/opt/kafka/data
    networks:
      - media-docker-proxy
    restart: unless-stopped
    environment:
      # KRaft settings for node 1
      - CLUSTER_ID=gZpsEhujeRQwA249Kx5KKg
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@media-docker-kafka-0:9093,1@media-docker-kafka-1:9093,2@media-docker-kafka-2:9093
      # Listeners
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://media-docker-kafka-1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Clustering settings
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
    depends_on:
      - media-docker-kafka-2

  media-docker-kafka-2:
    image: apache/kafka:3.8.0
    container_name: media-docker-kafka-2
    volumes:
      - media-docker-kafka-2_data:/opt/kafka/data
    networks:
      - media-docker-proxy
    restart: unless-stopped
    environment:
      # KRaft settings for node 2
      - CLUSTER_ID=gZpsEhujeRQwA249Kx5KKg
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=2
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@media-docker-kafka-0:9093,1@media-docker-kafka-1:9093,2@media-docker-kafka-2:9093
      # Listeners
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://media-docker-kafka-2:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Clustering settings
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2

volumes:
  # NOTE: Do not rename or change the volume names, this will cause breaking changes.
  media-docker-files-data:
    name: media-docker-files-data
  media-docker-upload-data:
    name: media-docker-upload-data
  media-docker-kafka-0_data:
    name: media-docker-kafka-0_data
  media-docker-kafka-1_data:
    name: media-docker-kafka-1_data
  media-docker-kafka-2_data:
    name: media-docker-kafka-2_data

networks:
  # NOTE: In production, use the nginx-proxy internal network for secure communication
  # The proxy network is used to serve media files that are accessed by frontend projects
  proxy:
    external: true
  # NOTE: The media-docker-proxy network is intended to be used with backend projects
  # to ensure proper network isolation and communication within the infrastructure
  media-docker-proxy:
    external: true
